appId: com.community.connect
---
# iOS Simulator — UI screenshot capture
# Run: maestro test .maestro/ios/screenshots.yaml
# Output: docs/screenshots/ios/

- launchApp
- extendedWaitUntil:
    visible: "Explore Events"
    timeout: 15000
- takeScreenshot: docs/screenshots/ios/01-explore

- tapOn:
    text: "Create"
- extendedWaitUntil:
    visible: "Host a Community Event"
    timeout: 10000
- takeScreenshot: docs/screenshots/ios/02-create

- tapOn:
    text: "Profile"
- extendedWaitUntil:
    visible: "Theme Preference"
    timeout: 10000
- takeScreenshot: docs/screenshots/ios/03-profile
