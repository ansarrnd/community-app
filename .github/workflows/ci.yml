name: CI

# Sole active pipeline — GitHub-hosted ubuntu runners only.
# Maestro / EAS release / legacy hybrid pipelines are disabled.
# See docs/CI_CD_PLAN.md

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check · Jest · Perf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Unit + integration tests
        run: npm test
      - name: Perf budgets
        run: npm run test:perf

  web-e2e:
    name: Web export · Playwright · Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build:web
      - run: npm run bundle:check
      - run: npm run test:e2e

  screenshots:
    name: Viewport screenshots · pixelmatch
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build:web
      - run: npm run screenshots:candidate
      - run: npm run screenshots:compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: docs/screenshots/.ci-candidate/
          retention-days: 14
