# Hybrid CI/CD Pipeline
# Cloud (ubuntu) + Self-hosted (macOS) — driven by ci/run.sh
#
# Execution modes:
#   hybrid (default): security/quality/test-android on cloud; ios/e2e on macOS
#   cloud:            all cloud-capable stages only
#   local:            all stages on current machine

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      stages:
        description: "Stages to run (space-separated)"
        required: false
        default: "security quality test"
      execution_mode:
        description: "Execution mode"
        type: choice
        options: [hybrid, cloud, local]
        default: hybrid
      stack:
        description: "Technology stack override"
        type: choice
        options: [react-native, flutter, kmp, cmp, kotlin-java, swift, objc]
        default: react-native

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CONFIG: ci/config/project.yml
  CI_EXECUTION_MODE: ${{ github.event.inputs.execution_mode || 'hybrid' }}

jobs:
  # ── Cloud: Security, Quality, JS/Android Tests ──────────────────────────────
  cloud-pipeline:
    name: Cloud Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_EXECUTION_MODE: cloud
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Install security tools
        run: |
          pip install semgrep
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Expo prebuild (Android)
        if: contains(github.event.inputs.stack || 'react-native', 'react-native')
        run: npx expo prebuild --platform android --no-install

      - name: Run CI pipeline (cloud stages)
        run: |
          STAGES="${{ github.event.inputs.stages || 'security quality test' }}"
          STACK="${{ github.event.inputs.stack || '' }}"
          ARGS=""
          [[ -n "$STACK" ]] && ARGS="--stack $STACK"
          chmod +x ci/run.sh ci/lib/runner.sh ci/tools/install-deps.sh
          ./ci/run.sh --mode cloud $ARGS $STAGES

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-artifacts
          path: |
            .ci-cache/artifacts/**
            coverage/**
          retention-days: 14

  # ── Self-hosted macOS: iOS Tests, Build, E2E ────────────────────────────────
  macos-pipeline:
    name: macOS Pipeline (Self-Hosted)
    runs-on: [self-hosted, macOS, ARM64]
    needs: cloud-pipeline
    if: github.event.inputs.execution_mode != 'cloud'
    continue-on-error: true
    timeout-minutes: 60
    env:
      CI_EXECUTION_MODE: local
      CI_SELF_HOSTED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Run macOS CI stages
        run: |
          chmod +x ci/run.sh
          ./ci/run.sh --mode local test build e2e

      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifacts
          path: .ci-cache/artifacts/**
          retention-days: 14

      - name: Cleanup Xcode DerivedData
        if: always()
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          xcrun simctl erase all || true

  # ── Deploy: staging on develop, production on main ────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [cloud-pipeline]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Deploy to staging
        env:
          CI_DEPLOY_ENV: staging
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          chmod +x ci/run.sh
          ./ci/run.sh deploy

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [cloud-pipeline]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Deploy to production
        env:
          CI_DEPLOY_ENV: production
          CI_DEPLOY_APPROVED: "true"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          chmod +x ci/run.sh
          ./ci/run.sh deploy
