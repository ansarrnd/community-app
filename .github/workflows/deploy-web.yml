name: Deploy web (GitHub Pages)

# Free HTTPS preview at https://ansarrnd.github.io/community-app/
# Mock backend (default) — no Firebase project or paid hosting.
# One-time: Settings → Pages → Source = GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Export static web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for GitHub Pages
        run: npm run build:web:pages
        env:
          GITHUB_PAGES_BASE: /community-app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
