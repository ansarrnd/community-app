# Fast security scan on every PR — no build dependencies required
name: Security Scan

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security & SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: ci/config/gitleaks.toml

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            ci/config/semgrep.yml

      - name: npm audit
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm audit --audit-level=high
        if: hashFiles('package.json') != ''

      - name: Run portable security stage
        run: |
          pip install semgrep
          chmod +x ci/run.sh
          CI_EXECUTION_MODE=cloud ./ci/run.sh security
