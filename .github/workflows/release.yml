name: Release (EAS)

# Production binaries + optional OTA / Functions.
# Requires EXPO_TOKEN (and optionally FIREBASE_TOKEN).
# See docs/CI_CD_PLAN.md Stage 5.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: 'EAS platforms (all | ios | android)'
        required: true
        default: all
      run_update:
        description: 'Also publish EAS Update to production channel'
        type: boolean
        default: false
      deploy_functions:
        description: 'Also deploy Firebase Cloud Functions'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eas-production-build:
    name: EAS production build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS Build (production)
        run: |
          PLATFORM="${{ github.event.inputs.platforms || 'all' }}"
          eas build --profile production --platform "$PLATFORM" --non-interactive --no-wait

  eas-ota-update:
    name: EAS Update (production channel)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_update == 'true' }}
    runs-on: ubuntu-latest
    needs: [eas-production-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish OTA update
        run: eas update --channel production --message "CI ${{ github.sha }}" --non-interactive

  firebase-functions:
    name: Deploy Cloud Functions
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_functions == 'true' }}
    runs-on: ubuntu-latest
    needs: [eas-production-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Functions deps
        working-directory: functions
        run: npm ci
      - name: Build Functions
        working-directory: functions
        run: npm run build
      - name: Deploy Functions
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only functions --non-interactive --token "$FIREBASE_TOKEN"
