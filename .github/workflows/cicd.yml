name: Hybrid CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =======================================================
  # JOB 1: CLOUD - Security & Static Analysis (Linux)
  # =======================================================
  security-and-quality:
    name: Security & Static Analysis (Cloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SAST Code Audit
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit

  # =======================================================
  # JOB 2: CLOUD - Web Build, Test & Deploy (Linux)
  # =======================================================
  web-pipeline:
    name: Web Build & Test (Cloud)
    runs-on: ubuntu-latest
    needs: security-and-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit
      - name: Playwright E2E Tests
        run: |
          npx playwright install --with-deps
          npx playwright test

  # =======================================================
  # JOB 3: CLOUD - Android Unit Tests & Lint (Linux)
  # =======================================================
  android-cloud-tests:
    name: Android Unit & Lint (Cloud)
    runs-on: ubuntu-latest
    needs: security-and-quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Generate Android Native Project via Expo Prebuild
        run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: android/gradle/wrapper/gradle-wrapper.properties
      - name: Run Lint & Unit Tests
        working-directory: ./android
        run: ./gradlew lint testDebugUnitTest

  # =======================================================
  # JOB 4: SELF-HOSTED - iOS Build, UI & Snapshot Tests (M2 Pro)
  # =======================================================
  ios-pipeline:
    name: iOS Build & Test (Local M2 Pro)
    runs-on: [self-hosted, macOS, ARM64]
    needs: security-and-quality
    steps:
      - uses: actions/checkout@v4
      - name: Run Fastlane iOS Tests
        run: bundle exec fastlane ios test
      - name: Build and Upload to TestFlight
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: bundle exec fastlane ios beta

        # Inside your self-hosted iOS job in .github/workflows/cicd.yml
        # Cleanup step always runs, even if previous steps fail
      - name: Post-Job DerivedData & Simulator Cleanup
        if: always()
        run: |
          echo "Clearing Xcode DerivedData for this workflow..."
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          echo "Erasing Simulator instances..."
          xcrun simctl erase all || true

  # =======================================================
  # JOB 5: SELF-HOSTED - Android Hardware-Accelerated E2E (M2 Pro)
  # =======================================================
  android-e2e-emulator:
    name: Android Hardware E2E (Local M2 Pro)
    runs-on: [self-hosted, macOS, ARM64]
    needs: android-cloud-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run Maestro E2E on ARM64 Emulator
        run: |
          # Uses local M2 Pro Android Studio SDK & native ARM64 emulator
          maestro test .maestro/android/