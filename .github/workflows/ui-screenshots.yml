name: UI Screenshot Reference

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'constants/theme.ts'
      - 'docs/screenshots/**'
      - 'scripts/capture-screenshots.mjs'

jobs:
  capture-viewport-screenshots:
    name: Capture iOS/Android viewport screenshots (web export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run build:web
      - run: npm run screenshots:candidate
      - run: npm run screenshots:compare
      - run: npm run bundle:check
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: docs/screenshots/.ci-candidate/
          retention-days: 14
